apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: microservices-staging
  labels:
    app: users-api
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
        environment: staging
    spec:
      containers:
      - name: users-api
        image: gcr.io/microservices-devops-0923/users-api:latest
        ports:
        - containerPort: 8083
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: LOG_LEVEL
        - name: USERS_API_PORT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: USERS_API_PORT
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "200m"
        # Health checks via TCP socket to avoid auth on HTTP path
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: microservices-staging
  labels:
    app: users-api
spec:
  selector:
    app: users-api
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
  type: ClusterIP

apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices-staging
data:
  # Redis Configuration (GCP Memorystore)
  REDIS_HOST: "10.219.117.51"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  
  # JWT Configuration
  JWT_SECRET: "PRFT"
  
